# ============================================================
#  BLAZE ROLEPLAY BOT — Render Blueprint
#  Samo 3 polja se popunjavaju: DISCORD_TOKEN, CLIENT_ID, GUILD_ID
#  Sva ostala podešavanja bot sam upiše kad pokreneš /setup-server
# ============================================================
services:
  - type: web
    name: blaze-roleplay-bot
    runtime: node
    plan: free
    region: frankfurt # najbliže Srbiji
    branch: main
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      # --- Tehnički (Render popunjava sam) ---
      - key: NODE_VERSION
        value: "20"

      # --- Fiksne vrednosti (ne diraj) ---
      - key: SERVER_NAME
        value: "Blaze Roleplay"
      - key: ENABLE_MESSAGE_CONTENT
        value: "true"
      - key: REGISTER_COMMANDS_ON_START
        value: "true"

      # --- OBAVEZNO POPUNITI (samo ova 3 polja) ---
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false

      # ============================================================
      #  SVE OSTALO NE TREBA OVDE!
      #
      #  ID-jeve kanala, kategorija i rola bot sam upiše u bazu
      #  kada pokreneš /setup-server — ne moraju u Environment.
      #
      #  Ako ti kasnije treba nešto dodatno (FiveM, automod),
      #  dodaš ručno: Render → servis → Environment → Add.
      #  Primeri:
      #     FIVEM_HOST        = 91.222.111.33
      #     FIVEM_CONNECT     = cfx.re/join/xxxx
      #     AUTOMOD_CAPS      = false
      #     WELCOME_DM        = true
      # ============================================================
